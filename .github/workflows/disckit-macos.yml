name: Build DiscKit.app (macOS)

on:
  push:
    branches: ["**"]
    paths: ["disckit/**", ".github/workflows/disckit-macos.yml"]
    tags: ["disckit-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build app and disk image (signed + notarized when Apple secrets are set)
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: bash disckit/packaging/macos/build_app.sh

      - name: Build summary
        run: |
          if ls disckit/dist/*-unsigned.dmg >/dev/null 2>&1; then
            echo "### DiscKit built UNSIGNED" >> "$GITHUB_STEP_SUMMARY"
            echo "Add the Apple secrets listed in disckit/packaging/macos/SIGNING.md to sign and notarize." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### DiscKit signed and notarized by Apple" >> "$GITHUB_STEP_SUMMARY"
          fi
          ls -la disckit/dist/*.dmg >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test the app on a real Wikipedia file
        run: |
          APP=disckit/dist/DiscKit.app/Contents/MacOS/DiscKit
          curl -sSL -o /tmp/ray.zim "$(curl -sSL https://download.kiwix.org/zim/wikipedia/ | grep -o 'wikipedia_en_ray-charles_maxi_[0-9-]*\.zim' | sort | tail -1 | sed 's#^#https://download.kiwix.org/zim/wikipedia/#')"
          "$APP" build zim /tmp/ray.zim --text-out /tmp/disc/T --media-out /tmp/disc/M --label RAY
          "$APP" verify /tmp/disc/T
          "$APP" verify /tmp/disc/M
          "$APP" read /tmp/disc/T /tmp/disc/M --no-browser --port 8899 &
          sleep 3
          curl -fsS http://127.0.0.1:8899/_disckit/ > /dev/null
          curl -fsS "http://127.0.0.1:8899/_disckit/api/fulltext?q=piano" | grep -q '"available": true'
          kill %1

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: DiscKit-macOS-arm64
          path: |
            disckit/dist/*.dmg
            disckit/dist/*.sha256
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/disckit-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            disckit/dist/*.dmg
            disckit/dist/*.sha256
